name: SwiftLint

on:
  workflow_dispatch:

  pull_request:

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup
        run:
          xcodes select 16.1

      - name: SwiftLint
        run:
          swift package plugin --allow-writing-to-package-directory swiftlint --reporter sarif --output swiftlint.report.sarif

      - name: Prepare swiftlint.report.sarif
        if: success() || failure()
        run:
          swift PrepareSarifToUpload.swift

      - name: Upload report
        uses: github/codeql-action/upload-sarif@458d36d7d4f47d0dd16ca424c1d3cda0060f1360 # v3.35.5
        if: success() || failure()
        with:
          sarif_file: swiftlint.report.sarif
